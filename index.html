<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <title>Responsive — Secure system</title>
  <style>
    /* -------------------------------------------------------------
       1. Custom Font Definitions
       ------------------------------------------------------------- */
    @font-face {
      font-family: "Orbit Sans";
      src: url("data:font/truetype;charset=utf-8;base64,AAEAAAASAQA=") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: "Orbit Display";
      src: url("data:font/truetype;charset=utf-8;base64,AAEAAAASAQA=") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    /* -------------------------------------------------------------
       2. Root Tokens & Document Reset
       ------------------------------------------------------------- */
    :root {
      --ink: #ffffff;
      --surface: #161616;
      --orb-reveal: cubic-bezier(0.16, 1, 0.3, 1);
      --orb-soft: cubic-bezier(0.25, 0.8, 0.28, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
      background-color: var(--surface);
      color: var(--ink);
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    /* -------------------------------------------------------------
       3. Viewport & Stage Shell
       ------------------------------------------------------------- */
    .viewport {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      background-color: var(--surface);
      overflow-x: hidden;
    }

    .skills-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 700px;
      background-color: #161616;
      overflow: hidden;
      z-index: 2;
    }

    .skills-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #161616;
      display: block;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      contain: strict;
      isolation: isolate;
      overflow: hidden;
      background-color: var(--surface);
    }

    /* -------------------------------------------------------------
       4. Brand Mark (Asterisk)
       ------------------------------------------------------------- */
    .brand-mark {
      position: absolute;
      top: 2.141745dvh;
      left: 3.854167vw;
      width: clamp(34px, min(3.4375vw, 5.2dvh), 66px);
      aspect-ratio: 66 / 62;
      color: var(--ink);
      z-index: 4;
      pointer-events: auto;
      cursor: pointer;
    }

    .brand-mark line {
      stroke: currentColor;
      stroke-width: 5px;
      stroke-linecap: square;
    }

    /* -------------------------------------------------------------
       5. Primary Navigation
       ------------------------------------------------------------- */
    .primary-nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .primary-nav__list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .primary-nav__item {
      position: absolute;
      top: 3.426791dvh;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .primary-nav__link {
      color: var(--ink);
      text-decoration: none;
      display: inline-block;
      pointer-events: auto;
      font-weight: 400;
      letter-spacing: 0.01em;
      transition: opacity 0.2s ease;
    }

    .primary-nav__link:hover,
    .primary-nav__link:focus-visible {
      opacity: 0.75;
      outline: none;
    }

    .primary-nav__item--home {
      left: 10.104167vw;
    }
    .primary-nav__item--home .primary-nav__link {
      transform: scaleX(1.165);
      transform-origin: left center;
    }

    .primary-nav__item--resources {
      left: 17.526042vw;
    }
    .primary-nav__item--resources .primary-nav__link {
      transform: scaleX(1.052);
      transform-origin: left center;
    }

    .primary-nav__item--benefits {
      left: 27.578125vw;
    }
    .primary-nav__item--benefits .primary-nav__link {
      transform: scaleX(1.126);
      transform-origin: left center;
    }

    .primary-nav__item--contact {
      left: 36.171875vw;
    }
    .primary-nav__item--contact .primary-nav__link {
      transform: scaleX(1.168);
      transform-origin: left center;
    }

    /* -------------------------------------------------------------
       6. Secure System Pill
       ------------------------------------------------------------- */
    .secure-pill {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      height: clamp(34px, 4.439252dvh, 57px);
      padding: 0 clamp(16px, 1.8vw, 28px);
      border-radius: 999px;
      background-color: #ffffff;
      color: var(--surface);
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      font-weight: 400;
      letter-spacing: 0.026923em;
      text-decoration: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 4;
      pointer-events: auto;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .secure-pill:hover,
    .secure-pill:focus-visible {
      transform: scale(1.03);
      outline: none;
    }

    /* -------------------------------------------------------------
       7. Wordmark RESPONSIVE
       ------------------------------------------------------------- */
    .orbit-word {
      position: absolute;
      top: 13.5dvh;
      left: 0;
      width: 100%;
      text-align: center;
      margin: 0;
      padding: 0;
      font-family: "Orbit Display", "Times New Roman", Times, serif;
      font-size: clamp(32px, min(14.2vw, 29dvh), 260px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0.025em;
      z-index: 1;
      pointer-events: none;
      white-space: nowrap;
    }

    .orbit-word__mask {
      display: inline-block;
      overflow: hidden;
      padding-bottom: 0.08em;
      margin-bottom: -0.08em;
      vertical-align: top;
    }

    .orbit-word__inner {
      display: inline-block;
    }

    .orbit-word__white {
      color: #ffffff;
    }

    .orbit-word__o {
      display: inline-block;
      transform: scaleX(1.06);
      transform-origin: center;
      margin-right: 0.02em;
    }

    .orbit-word__pink {
      background: linear-gradient(180deg, #ffc5dc 0%, #fd86db 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: inline-block;
    }

    /* -------------------------------------------------------------
       8. Flower Stack & Morph Reveal Canvas Layers
       ------------------------------------------------------------- */
    .flower {
      position: absolute;
      top: 14.749065dvh;
      left: 49.121328vw;
      height: 106.109034dvh;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
    }

    .flower__sizer {
      visibility: hidden;
      height: 100%;
      width: auto;
      display: block;
      pointer-events: none;
    }

    .flower__layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .flower__layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .flower__layer--top {
      mask-image: linear-gradient(#0000, #0000);
      -webkit-mask-image: linear-gradient(#0000, #0000);
      mask-size: 100% 100%;
      -webkit-mask-size: 100% 100%;
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-position: center;
      -webkit-mask-position: center;
    }

    .flower__layer--bg {
      mask-size: 100% 100%;
      -webkit-mask-size: 100% 100%;
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-position: center;
      -webkit-mask-position: center;
    }

    /* -------------------------------------------------------------
       9. Corner Copy
       ------------------------------------------------------------- */
    .support-copy {
      position: absolute;
      bottom: 4.361371dvh;
      color: #f7f7f7;
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
      font-size: clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
      font-weight: 400;
      line-height: 1.35;
      z-index: 3;
      pointer-events: none;
      white-space: nowrap;
    }

    .support-copy__inner {
      display: inline-block;
    }

    .support-copy--left {
      left: 3.177083vw;
    }
    .support-copy--left .support-copy__inner {
      transform: scaleX(1.073);
      transform-origin: left bottom;
    }

    .support-copy--right {
      left: 78.28125vw;
    }
    .support-copy--right .support-copy__inner {
      transform: scaleX(1.058);
      transform-origin: left bottom;
    }

    /* -------------------------------------------------------------
       10. Entrance Animations (Pure CSS while html.anim)
       ------------------------------------------------------------- */
    @keyframes orb-word {
      0% {
        transform: translateY(118%);
      }
      100% {
        transform: translateY(0);
      }
    }

    @keyframes orb-subject {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(3.4dvh);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes orb-quiet {
      0% {
        opacity: 0;
        transform: translateY(1.2dvh);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orb-corner {
      0% {
        opacity: 0;
        transform: translateY(1.5dvh);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orb-dim {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    html.anim .brand-mark {
      animation: orb-quiet 620ms var(--orb-soft) 100ms both;
    }

    html.anim .primary-nav__item:nth-child(1) {
      animation: orb-dim 550ms var(--orb-soft) 180ms both;
    }
    html.anim .primary-nav__item:nth-child(2) {
      animation: orb-dim 550ms var(--orb-soft) 225ms both;
    }
    html.anim .primary-nav__item:nth-child(3) {
      animation: orb-dim 550ms var(--orb-soft) 270ms both;
    }
    html.anim .primary-nav__item:nth-child(4) {
      animation: orb-dim 550ms var(--orb-soft) 315ms both;
    }

    html.anim .secure-pill {
      animation: orb-quiet 620ms var(--orb-soft) 340ms both;
    }

    html.anim .orbit-word__inner {
      animation: orb-word 1150ms var(--orb-reveal) 300ms both;
    }

    html.anim .flower {
      animation: orb-subject 1150ms var(--orb-reveal) 660ms both;
    }

    html.anim .support-copy__inner {
      animation: orb-corner 720ms var(--orb-soft) 980ms both;
    }

    /* -------------------------------------------------------------
       11. Mobile Chrome (Burger, Scrim, Sheet Menu)
       ------------------------------------------------------------- */
    .burger-btn {
      display: none;
      position: absolute;
      top: 2.141745dvh;
      right: 4vw;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      z-index: 12;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.2s ease;
    }

    .burger-btn:hover,
    .burger-btn:focus-visible {
      transform: scale(1.06);
      outline: none;
    }

    .burger-icon {
      width: 20px;
      height: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .burger-icon span {
      display: block;
      width: 100%;
      height: 2px;
      background: #161616;
      border-radius: 2px;
      transition: transform 0.3s var(--orb-reveal), opacity 0.2s ease;
      transform-origin: center;
    }

    .burger-btn[aria-expanded="true"] .burger-icon span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    .burger-btn[aria-expanded="true"] .burger-icon span:nth-child(2) {
      opacity: 0;
    }
    .burger-btn[aria-expanded="true"] .burger-icon span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--orb-soft);
    }

    .scrim.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-menu {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 85vw);
      background: rgba(22, 22, 22, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.35s var(--orb-reveal);
      flex-direction: column;
      padding: 5.5rem 2rem 2.5rem;
      gap: 2rem;
    }

    .sheet-menu.is-open {
      transform: translateX(0);
    }

    .sheet-menu__list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .sheet-menu__link {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
      transition: opacity 0.2s ease;
    }

    .sheet-menu__link:hover,
    .sheet-menu__link:focus-visible {
      opacity: 0.7;
    }

    .sheet-menu__pill {
      margin-top: auto;
      height: 48px;
      border-radius: 999px;
      background: #ffffff;
      color: #161616;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* -------------------------------------------------------------
       12. Responsive Breakpoints
       ------------------------------------------------------------- */
    @media (max-aspect-ratio: 4 / 5) {
      .primary-nav,
      .secure-pill {
        display: none !important;
      }

      .burger-btn,
      .scrim,
      .sheet-menu {
        display: flex;
      }

      html.anim .burger-btn {
        animation: orb-quiet 620ms var(--orb-soft) 180ms both;
      }

      .orbit-word {
        top: 12dvh;
        font-size: min(15.5vw, 14dvh);
      }

      .flower {
        top: 24dvh;
        height: min(55dvh, 110vw);
      }

      .support-copy {
        bottom: 3.5dvh;
        font-size: clamp(12px, 3.2vw, 16px);
        white-space: normal;
        max-width: 44vw;
      }

      .support-copy--left {
        left: 5vw;
      }

      .support-copy--right {
        left: auto;
        right: 5vw;
        text-align: right;
      }

      .support-copy--right .support-copy__inner {
        transform-origin: right bottom;
      }
    }

    @media (max-width: 900px) {
      .primary-nav,
      .secure-pill {
        display: none !important;
      }

      .burger-btn,
      .scrim,
      .sheet-menu {
        display: flex;
      }

      html.anim .burger-btn {
        animation: orb-quiet 620ms var(--orb-soft) 180ms both;
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      html.anim * {
        animation: none !important;
      }
      html.anim .stage {
        animation: orb-dim 280ms ease-out both !important;
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <!-- Skills Showcase Section (Field Manuals - ThreeUI) -->
    <section class="skills-section" id="skills" aria-label="Skills & Technologies">
      <iframe
        src="/landing-pages/bestsellers-book-showcase.html"
        title="Field Manuals — Tools for Thought"
        sandbox="allow-downloads allow-forms allow-modals allow-popups allow-same-origin allow-scripts"
        loading="eager"
        class="skills-iframe"
      ></iframe>
    </section>

    <!-- Responsive Section -->
    <section class="stage" id="stage">
      <!-- 1. Brand mark asterisk -->
      <svg class="brand-mark" viewBox="0 0 66 62" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Orbit logo">
        <line x1="33" y1="1" x2="33" y2="61" />
        <line x1="3" y1="31" x2="63" y2="31" />
        <line x1="11.8" y1="9.8" x2="54.2" y2="52.2" />
        <line x1="54.2" y1="9.8" x2="11.8" y2="52.2" />
      </svg>

      <!-- 2. Primary Navigation -->
      <nav class="primary-nav" aria-label="Primary">
        <ul class="primary-nav__list">
          <li class="primary-nav__item primary-nav__item--home">
            <a href="#home" class="primary-nav__link">Home</a>
          </li>
          <li class="primary-nav__item primary-nav__item--resources">
            <a href="#resources" class="primary-nav__link">Resources</a>
          </li>
          <li class="primary-nav__item primary-nav__item--benefits">
            <a href="#benefits" class="primary-nav__link">Benefits</a>
          </li>
          <li class="primary-nav__item primary-nav__item--contact">
            <a href="#contact" class="primary-nav__link">Contact</a>
          </li>
        </ul>
      </nav>

      <!-- 3. Secure System Pill -->
      <a href="#secure" class="secure-pill">Secure system</a>

      <!-- 4. Wordmark RESPONSIVE -->
      <h1 class="orbit-word" id="orbit-title" aria-label="Responsive">
        <span class="orbit-word__mask">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">R</span>ESP</span>
            <span class="orbit-word__pink">ONSIVE</span>
          </span>
        </span>
      </h1>

      <!-- 5. Flower Stack -->
      <div class="flower" id="flowerContainer">
        <img class="flower__sizer" src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&amp;w=1280&amp;q=85" alt="" aria-hidden="true">
        <div class="flower__layer flower__layer--bg" id="flowerBgLayer">
          <img src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&amp;w=1280&amp;q=85" alt="Pixel-art pink and violet lily">
        </div>
        <div class="flower__layer flower__layer--top" id="flowerTopLayer" aria-hidden="true">
          <img src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&amp;w=1280&amp;q=85" alt="">
        </div>
      </div>

      <!-- 6. Corner Copy -->
      <div class="support-copy support-copy--left">
        <div class="support-copy__inner">
          Every workflow,<br>intelligently connected.
        </div>
      </div>

      <div class="support-copy support-copy--right">
        <div class="support-copy__inner">
          Less manual work.<br>More meaningful output.
        </div>
      </div>
    </section>

    <!-- Mobile Chrome -->
    <button class="burger-btn" id="burgerBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileSheet">
      <div class="burger-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>

    <div class="scrim" id="mobileScrim" aria-hidden="true"></div>

    <aside class="sheet-menu" id="mobileSheet" aria-label="Mobile Navigation" aria-hidden="true" inert>
      <ul class="sheet-menu__list">
        <li><a href="#home" class="sheet-menu__link">Home</a></li>
        <li><a href="#resources" class="sheet-menu__link">Resources</a></li>
        <li><a href="#benefits" class="sheet-menu__link">Benefits</a></li>
        <li><a href="#contact" class="sheet-menu__link">Contact</a></li>
      </ul>
      <a href="#secure" class="sheet-menu__pill">Secure system</a>
    </aside>
  </main>

  <script>
    (function () {
      'use strict';

      /* -------------------------------------------------------------
         1. Entrance Animation Cleanup
         ------------------------------------------------------------- */
      const htmlEl = document.documentElement;
      let animCleaned = false;

      function cleanupAnim() {
        if (animCleaned) return;
        animCleaned = true;
        htmlEl.classList.remove('anim');
      }

      // 6000ms safety timeout + listener on corner animation
      const cornerInner = document.querySelector('.support-copy__inner');
      if (cornerInner) {
        cornerInner.addEventListener('animationend', () => {
          setTimeout(cleanupAnim, 200);
        });
      }
      setTimeout(cleanupAnim, 6000);

      /* -------------------------------------------------------------
         2. Mobile Menu Handling
         ------------------------------------------------------------- */
      const burgerBtn = document.getElementById('burgerBtn');
      const mobileScrim = document.getElementById('mobileScrim');
      const mobileSheet = document.getElementById('mobileSheet');
      const sheetLinks = mobileSheet ? mobileSheet.querySelectorAll('a') : [];

      function openMenu() {
        if (!burgerBtn || !mobileSheet) return;
        burgerBtn.setAttribute('aria-expanded', 'true');
        burgerBtn.setAttribute('aria-label', 'Close navigation menu');
        mobileSheet.classList.add('is-open');
        mobileSheet.removeAttribute('aria-hidden');
        mobileSheet.removeAttribute('inert');
        if (mobileScrim) {
          mobileScrim.classList.add('is-open');
          mobileScrim.removeAttribute('aria-hidden');
        }
      }

      function closeMenu() {
        if (!burgerBtn || !mobileSheet) return;
        burgerBtn.setAttribute('aria-expanded', 'false');
        burgerBtn.setAttribute('aria-label', 'Open navigation menu');
        mobileSheet.classList.remove('is-open');
        mobileSheet.setAttribute('aria-hidden', 'true');
        mobileSheet.setAttribute('inert', '');
        if (mobileScrim) {
          mobileScrim.classList.remove('is-open');
          mobileScrim.setAttribute('aria-hidden', 'true');
        }
      }

      function toggleMenu() {
        const isExpanded = burgerBtn.getAttribute('aria-expanded') === 'true';
        if (isExpanded) {
          closeMenu();
        } else {
          openMenu();
        }
      }

      if (burgerBtn) {
        burgerBtn.addEventListener('click', toggleMenu);
      }

      if (mobileScrim) {
        mobileScrim.addEventListener('click', closeMenu);
      }

      sheetLinks.forEach(link => {
        link.addEventListener('click', closeMenu);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && burgerBtn && burgerBtn.getAttribute('aria-expanded') === 'true') {
          closeMenu();
          burgerBtn.focus();
        }
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 900 && burgerBtn && burgerBtn.getAttribute('aria-expanded') === 'true') {
          closeMenu();
        }
      });

      /* -------------------------------------------------------------
         3. High-Performance Organic Mouse Morph-Reveal Trail Engine
         ------------------------------------------------------------- */
      const TRAIL_MAX_POINTS  = 60;
      const TRAIL_HEAD_R      = 140;
      const TRAIL_NOISE_AMP   = 44;
      const TRAIL_BLOB_PTS    = 24;
      const TRAIL_FADE_SPEED  = 0.92;
      const TRAIL_SAMPLE_DIST = 8;

      const stage = document.getElementById('stage');
      const flowerEl = document.getElementById('flowerContainer');
      const bgLayer = document.getElementById('flowerBgLayer');
      const topLayer = document.getElementById('flowerTopLayer');

      // Hidden offscreen canvases sized to .flower
      const canvasBg = document.createElement('canvas');
      canvasBg.style.display = 'none';
      const ctxBg = canvasBg.getContext('2d');

      const canvasTop = document.createElement('canvas');
      canvasTop.style.display = 'none';
      const ctxTop = canvasTop.getContext('2d');

      let hovering = false;
      let flowerMouseX = -9999;
      let flowerMouseY = -9999;
      let lastSampleX = -9999;
      let lastSampleY = -9999;
      let headRadius = 0;
      let time = 0;
      const points = [];

      let canvasW = 0;
      let canvasH = 0;
      let flowerRect = null;
      let coordScale = 1;

      function updateDimensions() {
        if (!flowerEl) return;
        flowerRect = flowerEl.getBoundingClientRect();
        if (flowerRect.width === 0 || flowerRect.height === 0) return;

        // Scale internal offscreen mask canvas for ultra-smooth 60fps encoding without CPU lag
        const maxDim = 400;
        coordScale = Math.min(1, maxDim / Math.max(flowerRect.width, flowerRect.height));
        const w = Math.max(1, Math.round(flowerRect.width * coordScale));
        const h = Math.max(1, Math.round(flowerRect.height * coordScale));

        if (w !== canvasW || h !== canvasH) {
          canvasW = w;
          canvasH = h;
          canvasBg.width = w;
          canvasBg.height = h;
          canvasTop.width = w;
          canvasTop.height = h;
        }
      }

      window.addEventListener('resize', updateDimensions, { passive: true });
      window.addEventListener('scroll', updateDimensions, { passive: true });

      function onPointerMove(e) {
        hovering = true;
        if (!flowerRect) updateDimensions();
        if (flowerRect && flowerRect.width > 0) {
          flowerMouseX = e.clientX - flowerRect.left;
          flowerMouseY = e.clientY - flowerRect.top;
        }
      }

      function onPointerEnter(e) {
        hovering = true;
        if (!flowerRect) updateDimensions();
        if (flowerRect && flowerRect.width > 0) {
          flowerMouseX = e.clientX - flowerRect.left;
          flowerMouseY = e.clientY - flowerRect.top;
        }
      }

      function onPointerLeave() {
        hovering = false;
        lastSampleX = -9999;
        lastSampleY = -9999;
      }

      window.addEventListener('mousemove', onPointerMove, { passive: true });
      window.addEventListener('pointermove', onPointerMove, { passive: true });
      if (stage) {
        stage.addEventListener('pointerenter', onPointerEnter, { passive: true });
        stage.addEventListener('pointerleave', onPointerLeave, { passive: true });
      }
      document.addEventListener('mouseleave', onPointerLeave);
      window.addEventListener('blur', onPointerLeave);

      /* -------------------------------------------------------------
         drawMorphBlob(ctx, cx, cy, r, t, seed)
         Skip if r < 2. 24 points:
         n1 = sin(angle*3 + t*1.4 + seed) * 0.45
         n2 = sin(angle*5 - t*0.9 + seed*2.3) * 0.3
         n3 = cos(angle*2 + t*1.8 + seed*0.7) * 0.25
         noise = (n1+n2+n3) * 44 * (r/140)
         Closed path via midpoints + quadraticCurveTo. Fill white.
         ------------------------------------------------------------- */
      function drawMorphBlob(ctx, cx, cy, r, t, seed) {
        if (r < 2) return;
        const numPts = TRAIL_BLOB_PTS;
        const coords = [];

        for (let i = 0; i < numPts; i++) {
          const angle = (i / numPts) * Math.PI * 2;
          const n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
          const n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
          const n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
          const noise = (n1 + n2 + n3) * (TRAIL_NOISE_AMP * coordScale) * (r / (TRAIL_HEAD_R * coordScale));
          const radius = Math.max(0, r + noise);
          coords.push({
            x: cx + Math.cos(angle) * radius,
            y: cy + Math.sin(angle) * radius
          });
        }

        ctx.beginPath();
        const firstMid = {
          x: (coords[0].x + coords[numPts - 1].x) / 2,
          y: (coords[0].y + coords[numPts - 1].y) / 2
        };
        ctx.moveTo(firstMid.x, firstMid.y);

        for (let i = 0; i < numPts; i++) {
          const current = coords[i];
          const next = coords[(i + 1) % numPts];
          const midX = (current.x + next.x) / 2;
          const midY = (current.y + next.y) / 2;
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        }

        ctx.closePath();
        ctx.fill();
      }

      function renderFrame() {
        time += 0.016;

        if (!flowerRect || canvasW === 0) {
          updateDimensions();
        }

        // 1. Head radius lerp per specification:
        // targetR = hovering ? 140 : 0
        // headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04)
        const targetR = hovering ? TRAIL_HEAD_R : 0;
        headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);

        // 2. When hovering and headRadius > 5, sample new points along path:
        if (hovering && headRadius > 5 && flowerMouseX > -9000) {
          const dist = Math.hypot(flowerMouseX - lastSampleX, flowerMouseY - lastSampleY);
          if (lastSampleX < -9000 || dist >= TRAIL_SAMPLE_DIST) {
            const steps = lastSampleX < -9000 ? 1 : Math.min(8, Math.max(1, Math.floor(dist / TRAIL_SAMPLE_DIST)));
            for (let s = 1; s <= steps; s++) {
              const tInterp = s / steps;
              const ptX = lastSampleX < -9000 ? flowerMouseX : (lastSampleX + (flowerMouseX - lastSampleX) * tInterp);
              const ptY = lastSampleY < -9000 ? flowerMouseY : (lastSampleY + (flowerMouseY - lastSampleY) * tInterp);
              points.push({
                x: ptX,
                y: ptY,
                r: headRadius,
                alpha: 1.0,
                seed: Math.random() * 100
              });
            }
            while (points.length > TRAIL_MAX_POINTS) {
              points.shift();
            }
            lastSampleX = flowerMouseX;
            lastSampleY = flowerMouseY;
          }
        }

        // 3. Decay: alpha *= 0.92; r *= 0.995; remove if alpha < 0.01
        for (let i = points.length - 1; i >= 0; i--) {
          const pt = points[i];
          pt.alpha *= TRAIL_FADE_SPEED;
          pt.r *= 0.995;
          if (pt.alpha < 0.01) {
            points.splice(i, 1);
          }
        }

        // 4. Render dual-layer offscreen canvas masks
        const isHeadActive = hovering && headRadius > 2 && flowerMouseX > -9000;
        const hasPoints = points.length > 0;

        if (canvasW > 0 && canvasH > 0) {
          if (hasPoints || isHeadActive) {
            // FRONT/BG layer (invert=false): white fill -> destination-out blobs = holes
            ctxBg.globalCompositeOperation = 'source-over';
            ctxBg.fillStyle = '#ffffff';
            ctxBg.fillRect(0, 0, canvasW, canvasH);

            ctxBg.globalCompositeOperation = 'destination-out';
            for (let i = 0; i < points.length; i++) {
              const pt = points[i];
              ctxBg.fillStyle = `rgba(0, 0, 0, ${pt.alpha})`;
              drawMorphBlob(ctxBg, pt.x * coordScale, pt.y * coordScale, pt.r * coordScale, time, pt.seed);
            }
            if (isHeadActive) {
              ctxBg.fillStyle = 'rgba(0, 0, 0, 1)';
              drawMorphBlob(ctxBg, flowerMouseX * coordScale, flowerMouseY * coordScale, headRadius * coordScale, time, 42);
            }

            // REVEAL/TOP layer (invert=true): clear canvas -> white blobs = only trail shows
            ctxTop.clearRect(0, 0, canvasW, canvasH);
            ctxTop.globalCompositeOperation = 'source-over';
            for (let i = 0; i < points.length; i++) {
              const pt = points[i];
              ctxTop.fillStyle = `rgba(255, 255, 255, ${pt.alpha})`;
              drawMorphBlob(ctxTop, pt.x * coordScale, pt.y * coordScale, pt.r * coordScale, time, pt.seed);
            }
            if (isHeadActive) {
              ctxTop.fillStyle = 'rgba(255, 255, 255, 1)';
              drawMorphBlob(ctxTop, flowerMouseX * coordScale, flowerMouseY * coordScale, headRadius * coordScale, time, 42);
            }

            const bgDataUrl = canvasBg.toDataURL('image/png');
            const topDataUrl = canvasTop.toDataURL('image/png');

            if (bgLayer) {
              bgLayer.style.maskImage = `url(${bgDataUrl})`;
              bgLayer.style.webkitMaskImage = `url(${bgDataUrl})`;
            }
            if (topLayer) {
              topLayer.style.maskImage = `url(${topDataUrl})`;
              topLayer.style.webkitMaskImage = `url(${topDataUrl})`;
            }
          } else {
            // Fully reset when idle
            if (bgLayer && bgLayer.style.maskImage !== '') {
              bgLayer.style.maskImage = '';
              bgLayer.style.webkitMaskImage = '';
            }
            if (topLayer && topLayer.style.maskImage !== 'linear-gradient(#0000, #0000)') {
              topLayer.style.maskImage = 'linear-gradient(#0000, #0000)';
              topLayer.style.webkitMaskImage = 'linear-gradient(#0000, #0000)';
            }
          }
        }

        requestAnimationFrame(renderFrame);
      }

      // Initialize
      updateDimensions();
      requestAnimationFrame(renderFrame);
    })();
  </script>
</body>
</html>
