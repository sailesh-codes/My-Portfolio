<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
		<meta name="generator" content="Portfolio" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Krona+One&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
		<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
		<script>
		  // Ensure dark mode is applied before React mounts to avoid flash of light theme
		  (function () {
		    try {
		      var saved = localStorage.getItem('theme');
		      if (saved) {
		        if (saved === 'dark') document.documentElement.classList.add('dark');
		        // if saved is 'light', leave as is
		      } else {
		        // Default to dark on first visit
		        document.documentElement.classList.add('dark');
		      }
		    } catch (e) {
		      // Fallback to dark if localStorage is unavailable
		      document.documentElement.classList.add('dark');
		    }
		  })();
		</script>
		<title>Sailesh</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
